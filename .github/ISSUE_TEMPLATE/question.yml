name: Question
description: Ask how something works, or why a form was flagged.
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        **This issue will be public.** Do not include patient information, form answers, license keys, or details that identify your organization.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed patient information, form answers, license keys, and private site details from this question.
          required: true
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - Form Marshal
        - Form Marshal Pro
        - Both
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
