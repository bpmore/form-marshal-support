name: Bug report
description: Something in Form Marshal or Form Marshal Pro is not working as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **This issue will be public.** Do not include patient information, form answers, license keys, or details that identify your organization. Describe forms and fields in general terms.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed patient information, form answers, license keys, and private site details from this report.
          required: true
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - Form Marshal
        - Form Marshal Pro
        - Both
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Form Marshal, Form Marshal Pro (if used), WordPress, and PHP.
      placeholder: "Form Marshal 0.5.0, Pro 0.1.0, WordPress 7.1, PHP 8.2"
    validations:
      required: true
  - type: dropdown
    id: form-plugin
    attributes:
      label: Form plugin
      multiple: true
      options:
        - Gravity Forms
        - Ninja Forms
        - WPForms
        - Contact Form 7
        - Not related to a form plugin
  - type: dropdown
    id: multisite
    attributes:
      label: Multisite
      options:
        - "No"
        - "Yes"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Error messages
      description: Any error text or PHP log lines, with private details removed.
      render: text
